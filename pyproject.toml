[project]
name = "reqguard"
version = "0.1.0"
description = "Requirement-derived mutation testing — does your suite actually protect what the spec says?"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    # Runtime, not dev: run_tests always passes --json-report, so a user project
    # without the plugin gets pytest exit 4 and every run is ENVIRONMENT_ERROR.
    "pytest>=8",
    "pytest-json-report>=1.5",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[project.scripts]
reqguard = "reqguard.cli.main:app"
reqguard-mcp = "reqguard.integrations.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reqguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
