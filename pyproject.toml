[project]
name = "reqguard"
version = "0.1.0"
description = "Requirement-derived mutation testing — does your suite actually protect what the spec says?"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "google-genai>=2.3.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-json-report>=1.5", "ruff", "mypy"]

[project.scripts]
reqguard = "reqguard.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reqguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
